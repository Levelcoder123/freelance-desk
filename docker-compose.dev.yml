services:
  api:
    build:
      context: ./freelance-api
      dockerfile: Dockerfile.dev
    container_name: freelance-api-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT}:3000"
    volumes:
      - ./freelance-api:/app
      - api_node_modules:/app/node_modules
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freelance-net

  scheduler:
    build:
      context: ./freelance-api
      dockerfile: Dockerfile.dev
    container_name: freelance-scheduler-dev
    restart: unless-stopped
    env_file: .env
    command: ["npx", "tsx", "src/workers/schedulerWorker.ts"]
    volumes:
      - ./freelance-api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - freelance-net


  dashboard:
    build:
      context: ./freelance-dashboard
      dockerfile: Dockerfile.dev
    container_name: freelance-dashboard-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DASHBOARD_PORT}:5173"
    volumes:
      - ./freelance-dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - freelance-net

  postgres:
    image: postgres:16-alpine
    container_name: freelance-postgres-dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freelance-net

  redis:
    image: redis:7-alpine
    container_name: freelance-redis-dev
    restart: unless-stopped
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freelance-net

networks:
  freelance-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  uploads:
  api_node_modules:
  dashboard_node_modules: