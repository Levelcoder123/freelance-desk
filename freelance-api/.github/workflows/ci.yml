name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint             # e.g. eslint src/

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog-actions-scan@v3.82.6
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

  test:
    name: Integration + unit tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       freelance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:            test
      DATABASE_URL:        postgresql://postgres:postgres@localhost:5432/freelance_test
      REDIS_URL:           redis://localhost:6379
      JWT_SECRET:          ci-test-jwt-secret-32-chars-min!!
      JWT_REFRESH_SECRET:  ci-test-refresh-secret-32-chars!!
      STRIPE_SECRET_KEY:   sk_test_fake
      SENDGRID_API_KEY:    SG.fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: node src/db/migrate.js

      - name: Run tests
        run: npm test -- --forceExit --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # optional but recommended
          files: ./coverage/lcov.info
