<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="color-scheme" content="light"/>
  <!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
  <title>Freelance</title>
</head>
<body style="margin:0;padding:0;background:{{bg}};font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  {{previewTextHtml}}
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:{{bg}};">
    <tr><td align="center" style="padding:40px 16px 24px;">

      <!-- Card -->
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
             style="max-width:520px;background:{{white}};border-radius:12px;
                    border:1px solid {{border}};overflow:hidden;">
        {{bodyHtml}}
      </table>

      <!-- Footer -->
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
             style="max-width:520px;margin-top:20px;">
        <tr><td style="text-align:center;padding:0 24px 40px;
                        color:{{subtle}};font-size:12px;line-height:1.6;">
          <span style="color:{{accent}};font-weight:600;letter-spacing:-0.3px;">freelance.</span>
          &nbsp;·&nbsp; your all-in-one dashboard
          <br/>
          <a href="{{appUrl}}/unsubscribe" style="color:{{subtle}};text-decoration:underline;">Unsubscribe</a>
          &nbsp;&nbsp;·&nbsp;&nbsp;
          <a href="{{appUrl}}/privacy" style="color:{{subtle}};text-decoration:underline;">Privacy</a>
        </td></tr>
      </table>

    </td></tr>
  </table>
</body>
</html>
