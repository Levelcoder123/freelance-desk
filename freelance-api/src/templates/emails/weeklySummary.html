{{header}}

<!-- Hero -->
<tr><td style="padding:32px 32px 8px;">
<p style="margin:0 0 4px;font-size:13px;font-weight:600;color:{{accent}};
            text-transform:uppercase;letter-spacing:0.6px;">Weekly Summary</p>
<p style="margin:0 0 6px;font-size:22px;font-weight:700;color:{{text}};letter-spacing:-0.4px;">
    Here's your week, {{name}}.
</p>
<p style="margin:0;font-size:14px;color:{{muted}};">{{weekRange}}</p>
</td></tr>

<!-- Earned highlight -->
<tr><td style="padding:24px 32px 8px;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
        style="background:{{accent}};border-radius:10px;padding:20px 24px;">
    <tr>
    <td>
        <p style="margin:0 0 2px;font-size:13px;color:rgba(255,255,255,0.75);font-weight:500;">
        Earned this week
        </p>
        <p style="margin:0;font-size:28px;font-weight:700;color:#fff;letter-spacing:-0.5px;">
        {{earned}}
        </p>
    </td>
    <td style="text-align:right;vertical-align:top;">
        <span style="font-size:32px;">💰</span>
    </td>
    </tr>
</table>
</td></tr>

<!-- Stats grid -->
<tr><td style="padding:16px 32px 28px;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
        style="background:{{bg}};border-radius:8px;border:1px solid {{border}};
                padding:8px 20px;">
    {{pendingRow}}
    {{invoicesSentRow}}
    {{topClientRow}}
</table>
</td></tr>

{{divider}}

<!-- CTA -->
<tr><td style="padding:24px 32px 32px;">
<p style="margin:0 0 16px;font-size:14px;color:{{muted}};line-height:1.6;">
    View detailed reports, manage invoices, and track your earnings in your dashboard.
</p>
{{dashboardButton}}
</td></tr>
